name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  marketplace-freshness:
    name: marketplace.json / REGISTRY.md are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/generate_marketplace.py --check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action requires a paid license for organization
      # repos (https://github.com/gitleaks/gitleaks-action#-announcement).
      # The underlying gitleaks CLI is still free/open-source, so install
      # and run it directly instead. Module path is zricethezav/gitleaks —
      # it predates the project moving to the gitleaks GitHub org.
      - run: go install github.com/zricethezav/gitleaks/v8@latest
      - run: $(go env GOPATH)/bin/gitleaks detect --source . --redact -v
